name: Continuous Integration

on:
  push:
    branches:
    - master

  pull_request:
    branches:
    - master

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with: { python-version: "3.12" }

    - name: Install clang-format
      run: sudo apt-get update -q
        && sudo apt-get install clang-format-18 -q -y

    - name: Install codespell
      run: pip3 install codespell

    - name: Lint
      run: cmake -D FORMAT_COMMAND=clang-format-18 -P cmake/lint.cmake

    - name: Spell check
      if: always()
      run: cmake -P cmake/spell.cmake

  sanitize:
    needs: [lint]

    strategy:
      matrix:
        compiler: [gcc, clang-18, clang-19, clang-20, clang-21, clang-22]
        build_type: [Debug, Release]
        include:
        - { compiler: gcc, cxx: g++, tidy: clang-tidy-22 }
        - { compiler: clang-18, cxx: clang++-18, tidy: clang-tidy-18 }
        - { compiler: clang-19, cxx: clang++-19, tidy: clang-tidy-19 }
        - { compiler: clang-20, cxx: clang++-20, tidy: clang-tidy-20 }
        - { compiler: clang-21, cxx: clang++-21, tidy: clang-tidy-21 }
        - { compiler: clang-22, cxx: clang++-22, tidy: clang-tidy-22 }

    runs-on: ubuntu-26.04

    env:
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install static analyzers
      run: >-
        sudo apt-get update && sudo apt-get install build-essential cmake git clang-18 clang-19 clang-20 clang-21 clang-22 clang-tidy-18 clang-tidy-19 clang-tidy-20 clang-tidy-21 clang-tidy-22 cppcheck -y -q

    - name: Configure
      run: cmake --preset=ci-ubuntu
        -D CMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -D fast_hex_ENABLE_SANITIZERS=ON
        -D "CMAKE_CXX_CLANG_TIDY=${{ matrix.tidy }};--header-filter=^${{ github.workspace }}/"

    - name: Build
      run: cmake --build build -j 2

    - name: Test
      working-directory: build
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
      run: ctest --output-on-failure --no-tests=error -j 2

  test:
    needs: [lint]

    strategy:
      matrix:
        compiler: [gcc, clang-18, clang-19, clang-20, clang-21, clang-22]

        build_type: [Debug, Release]

        include:
        - { compiler: gcc, cxx: g++, tidy: clang-tidy-22 }
        - { compiler: clang-18, cxx: clang++-18, tidy: clang-tidy-18 }
        - { compiler: clang-19, cxx: clang++-19, tidy: clang-tidy-19 }
        - { compiler: clang-20, cxx: clang++-20, tidy: clang-tidy-20 }
        - { compiler: clang-21, cxx: clang++-21, tidy: clang-tidy-21 }
        - { compiler: clang-22, cxx: clang++-22, tidy: clang-tidy-22 }

    runs-on: ubuntu-26.04

    env:
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install static analyzers
      run: >-
        sudo apt-get update && sudo apt-get install build-essential cmake git clang-18 clang-19 clang-20 clang-21 clang-22 clang-tidy-18 clang-tidy-19 clang-tidy-20 clang-tidy-21 clang-tidy-22 cppcheck -y -q

    - name: Configure
      run: cmake --preset=ci-ubuntu
        -D CMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -D "CMAKE_CXX_CLANG_TIDY=${{ matrix.tidy }};--header-filter=^${{ github.workspace }}/"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 2

    - name: Install
      run: cmake --install build --config ${{ matrix.build_type }} --prefix prefix

    - name: Show CPU
      run: lscpu

    - name: Test
      working-directory: build
      # Fail rather than skip the AVX2 tests if a runner's CPU lacks it
      env:
        FAST_HEX_TEST_REQUIRE: avx2
      run: ctest --output-on-failure --no-tests=error -C ${{ matrix.build_type }} -j 2

  test-arm64:
    needs: [lint]

    strategy:
      matrix:
        compiler: [gcc, clang-18, clang-19, clang-20, clang-21, clang-22]

        build_type: [Debug, Release]

        # ASan + UBSan
        sanitizers: [OFF, ON]

        include:
        - { compiler: gcc, cxx: g++ }
        - { compiler: clang-18, cxx: clang++-18 }
        - { compiler: clang-19, cxx: clang++-19 }
        - { compiler: clang-20, cxx: clang++-20 }
        - { compiler: clang-21, cxx: clang++-21 }
        - { compiler: clang-22, cxx: clang++-22 }

    runs-on: ubuntu-26.04-arm

    env:
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: >-
        sudo apt-get update && sudo apt-get install build-essential cmake git qemu-user ${{ matrix.compiler }} -y -q

    - name: Configure
      run: cmake --preset=ci-ubuntu-arm
        -D CMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -D fast_hex_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

    - name: Build
      run: cmake --build build -j 4

    - name: Show CPU
      run: lscpu

    - name: Test
      working-directory: build
      env:
        # sve too: the sanitizer builds run the SVE code here only, not under QEMU
        FAST_HEX_TEST_REQUIRE: neon,sve
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
      run: ctest --output-on-failure --no-tests=error -j 4

    # The runners' CPUs have 128-bit SVE vectors only, where encodeHexSve hands
    # over to NEON. QEMU's "max" CPU has every length up to 2048 bits, and the
    # tests run at each: sve-vl=16 fails the step unless every SVE test ran at
    # all 16 of them.
    # Not the sanitizer builds: ASan does not run under QEMU
    - name: Test SVE at every vector length under QEMU
      if: matrix.sanitizers == 'OFF'
      env:
        FAST_HEX_TEST_REQUIRE: neon,sve,sve-vl=16
      run: qemu-aarch64 -cpu max,sve=on build/test/source/fast_hex_test

  # Big-endian AArch64: no hosted runner exists, so cross-compile with a
  # Bootlin aarch64be toolchain and run the tests under QEMU user-mode
  # emulation, which faithfully reproduces byte-order behavior.
  test-arm64-be:
    needs: [lint]

    runs-on: ubuntu-26.04

    env:
      BOOTLIN_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64be/tarballs/aarch64be--glibc--stable-2026.08-1.tar.xz

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install QEMU
      # qemu-user-static became a virtual package in Ubuntu 26.04; qemu-user
      # provides the qemu-aarch64_be emulator binary used by the toolchain file
      run: sudo apt-get update && sudo apt-get install qemu-user -y -q

    - name: Cache toolchain
      id: cache-tc
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/aarch64be
        key: bootlin-aarch64be-2026.08-1

    - name: Fetch toolchain
      if: steps.cache-tc.outputs.cache-hit != 'true'
      run: |
        wget -q "$BOOTLIN_URL"
        mkdir -p "${{ runner.temp }}/aarch64be"
        tar -xJf aarch64be--glibc--stable-2026.08-1.tar.xz \
          -C "${{ runner.temp }}/aarch64be" --strip-components=1

    - name: Set toolchain root
      # runner.temp is not available in job-level env, so export it per step
      run: echo "BOOTLIN_TC_ROOT=${{ runner.temp }}/aarch64be" >> "$GITHUB_ENV"

    - name: Configure
      run: cmake --preset=ci-ubuntu-arm
        -D CMAKE_TOOLCHAIN_FILE=cmake/aarch64be-toolchain.cmake

    - name: Build
      run: cmake --build build -j 2

    - name: Test
      working-directory: build
      env:
        FAST_HEX_TEST_REQUIRE: neon,sve,sve-vl=16
      run: ctest --output-on-failure --no-tests=error -j 2

  # 32-bit ARMv7 with NEON, where the NEON code falls back from the AArch64-only
  # instructions: cross-compile and run the tests under QEMU user-mode emulation
  test-armv7:
    needs: [lint]

    strategy:
      matrix:
        build_type: [Debug, Release]

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: >-
        sudo apt-get update && sudo apt-get install cmake g++-arm-linux-gnueabihf qemu-user -y -q

    - name: Configure
      run: cmake --preset=ci-ubuntu-arm
        -D CMAKE_TOOLCHAIN_FILE=cmake/armv7-toolchain.cmake
        -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build -j 2

    - name: Test
      working-directory: build
      env:
        FAST_HEX_TEST_REQUIRE: neon
      run: ctest --output-on-failure --no-tests=error -j 2

  # AVX-512 and VBMI: the hosted runners' CPUs have neither, so the tests for
  # them skip there. Intel SDE emulates an Ice Lake server CPU, which has both
  test-x86-sde:
    needs: [lint]

    strategy:
      matrix:
        compiler: [gcc, clang-22]

        include:
        - { compiler: gcc, cxx: g++ }
        - { compiler: clang-22, cxx: clang++-22 }

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: >-
        sudo apt-get update && sudo apt-get install build-essential cmake ${{ matrix.compiler }} -y -q

    - name: Install Intel SDE
      uses: petarpetrovt/setup-sde@v6.0

    # No static analyzers: the test job runs them
    - name: Configure
      run: cmake --preset=ci-ubuntu
        -D CMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -D CMAKE_BUILD_TYPE=Release
        -D CMAKE_CXX_CLANG_TIDY=
        -D CMAKE_CXX_CPPCHECK=

    - name: Build
      run: cmake --build build -j 2

    # SDE attaches to the test with ptrace, which Ubuntu restricts by default
    - name: Allow ptrace
      run: sudo sysctl -w kernel.yama.ptrace_scope=0

    - name: Test
      env:
        FAST_HEX_TEST_REQUIRE: avx2,avx512,avx512vbmi
      run: >-
        "$SDE_PATH/sde64" -icx -- build/test/source/fast_hex_test

  # Apple Silicon: Apple Clang, libc++ and 16 KiB pages
  test-macos:
    needs: [lint]

    strategy:
      matrix:
        build_type: [Debug, Release]

        # ASan + UBSan
        sanitizers: [OFF, ON]

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure
      run: cmake --preset=ci-macos
        -D CMAKE_CONFIGURATION_TYPES=${{ matrix.build_type }}
        -D fast_hex_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j 3

    - name: Test
      working-directory: build
      # No detect_leaks: LeakSanitizer is not supported on Apple arm64
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
        FAST_HEX_TEST_REQUIRE: neon
      run: ctest --output-on-failure --no-tests=error -C ${{ matrix.build_type }} -j 3

  fuzz:
    needs: [lint]

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: >-
        sudo apt-get update && sudo apt-get install build-essential cmake git clang-18 clang-tidy-18 cppcheck -y -q

    - name: Configure
      run: cmake --preset=ci-ubuntu
        -D CMAKE_CXX_COMPILER=clang++-18
        -D CMAKE_BUILD_TYPE=Release
        -D fast_hex_ENABLE_FUZZ=ON
        -D "CMAKE_CXX_CLANG_TIDY=clang-tidy-18;--header-filter=^${{ github.workspace }}/"

    - name: Build
      run: cmake --build build -j 2

    - name: Fuzz
      working-directory: build
      run: ctest --output-on-failure -R fuzz -j 1

  # Not on macOS: Apple Clang does not ship libFuzzer
  fuzz-arm64:
    needs: [lint]

    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: >-
        sudo apt-get update && sudo apt-get install build-essential cmake git clang-18 -y -q

    - name: Configure
      run: cmake --preset=ci-ubuntu-arm
        -D CMAKE_CXX_COMPILER=clang++-18
        -D CMAKE_BUILD_TYPE=Release
        -D fast_hex_ENABLE_FUZZ=ON

    - name: Build
      run: cmake --build build -j 4

    - name: Fuzz
      working-directory: build
      run: ctest --output-on-failure -R fuzz -j 1
